name: Publish planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web tests
        run: npm test
      - name: Data builder tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Stamp version and build id
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g; s/__VERSION__/${VERSION}/g" web/index.html web/crafting.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
